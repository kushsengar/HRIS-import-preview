<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRIS Import Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 { margin-bottom: 8px; }
        p.subtitle { color: #666; margin-top: 0; }
        .upload-box {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-top: 30px;
        }
        input[type="file"] { margin: 16px 0; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>HRIS Import Preview</h1>
    <p class="subtitle">Upload an HRIS CSV file to preview and validate before import.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="upload-box">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <p>Select an HRIS CSV file</p>
            <input type="file" name="csv_file" accept=".csv">
            <br>
            <button type="submit">Upload &amp; Preview</button>
        </form>
    </div>
</body>
</html>
